<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="dsh_bg" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="50%" stop-color="#080e1c"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="dsh_border" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f7ae8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2a3f6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#182848" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="dsh_glow" cx="128" cy="120" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38a8ff" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#7c57d8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dsh_m_grad" x1="78" y1="80" x2="178" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38a8ff"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9055ff"/>
    </linearGradient>
    <linearGradient id="dsh_diamond_grad" x1="110" y1="52" x2="146" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38f9d7"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="dsh_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="dsh_neon" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38a8ff" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#dsh_bg)" stroke="url(#dsh_border)" stroke-width="2.5"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#dsh_glow)"/>

  <!-- Subtle Concentric Orbit Guide -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="#1d2e4e" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>

  <g filter="url(#dsh_shadow)">
    <!-- Outer Shield / Network Hexagon Frame -->
    <path d="M128 36 L200 76 L200 160 L128 200 L56 160 L56 76 Z" fill="#0c1527" stroke="#22365c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Subtle Connectivity Guidance Lines -->
    <line x1="128" y1="88" x2="128" y2="138" stroke="#1e3256" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="128" y1="70" x2="78" y2="94" stroke="#1e3256" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="128" y1="70" x2="178" y2="94" stroke="#1e3256" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Bold 'M' Gateway Conduit (Luminous Mesh) -->
    <!-- Glow Backdrop -->
    <path d="M78 162 L78 94 L128 138 L178 94 L178 162" fill="none" stroke="url(#dsh_m_grad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#dsh_neon)"/>
    <!-- Core White-Hot Filament -->
    <path d="M78 162 L78 94 L128 138 L178 94 L178 162" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>

    <!-- Apex Control Diamond (Manager Hub) -->
    <path d="M128 52 L146 70 L128 88 L110 70 Z" fill="url(#dsh_diamond_grad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" filter="url(#dsh_neon)"/>
    <circle cx="128" cy="70" r="3.5" fill="#ffffff"/>

    <!-- Left Agent Endpoint -->
    <circle cx="78" cy="162" r="9.5" fill="#0e172a" stroke="#38a8ff" stroke-width="3.5"/>
    <circle cx="78" cy="162" r="4.5" fill="#3dd598"/>

    <!-- Right Agent Endpoint -->
    <circle cx="178" cy="162" r="9.5" fill="#0e172a" stroke="#8b5cf6" stroke-width="3.5"/>
    <circle cx="178" cy="162" r="4.5" fill="#3dd598"/>

    <!-- Central Convergence Nexus -->
    <circle cx="128" cy="138" r="10" fill="#0e172a" stroke="#00f2fe" stroke-width="3.5"/>
    <circle cx="128" cy="138" r="5" fill="#ffffff" filter="url(#dsh_neon)"/>
  </g>
</svg>