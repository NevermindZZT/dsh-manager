<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>dsh-manager</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#141c31e8;--panel2:#18233d;--line:#2a3a5e;--text:#edf4ff;--muted:#91a4c5;--blue:#5b8cff;--green:#3dd598;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px/1.5 Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#1d3a70 0,#0b1020 42%),var(--bg)}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#263653}button.danger{background:#a83b56}.shell{max-width:1320px;margin:auto;padding:28px 22px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6ea0ff,#7c57d8);display:grid;place-items:center;font-size:23px}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:var(--muted)}.top-actions{display:flex;gap:8px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 16px 50px #0003}.card.half{grid-column:span 6}.card h2{font-size:16px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--panel2);border-radius:14px;padding:15px}.stat b{font-size:26px;display:block}.muted{color:var(--muted)}.instance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}.instance{background:linear-gradient(145deg,#182642,#111a2d);border:1px solid #2e4268;border-radius:15px;padding:16px}.instance-head{display:flex;justify-content:space-between;gap:8px}.instance h3{margin:0;font-size:15px}.pill{font-size:11px;border-radius:999px;padding:3px 8px;background:#263653;color:var(--muted)}.pill.online,.running{color:var(--green)}.failed,.offline{color:var(--red)}.instance code{display:block;color:#87adff;font-size:11px;margin:8px 0;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.fingerprint{filter:blur(5px);user-select:none;cursor:pointer}.fingerprint.revealed{filter:none;user-select:text}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:7px 10px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 24px 80px #0007}.login h1{margin:0 0 5px}.login p{color:var(--muted);margin:0 0 25px}.field{display:block;margin:14px 0}.field span{display:block;color:var(--muted);margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);background:#0d1629;color:var(--text);border-radius:10px;padding:12px;outline:none}.login button{width:100%;margin-top:12px}.error{color:#ff8792;margin-top:12px;min-height:21px}.hidden{display:none!important}@media(max-width:720px){.shell{padding:20px 14px}.card.half{grid-column:span 12}.stats{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.top-actions{flex-direction:column}}
</style></head><body><section id="loginView" class="login-wrap"><form id="loginForm" class="login"><div class="logo">◆</div><h1>dsh-manager</h1><p>登录后管理所有已注册的 dsh 实例</p><label class="field"><span>用户名</span><input id="username" autocomplete="username" required value="admin"></label><label class="field"><span>密码</span><input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录管理控制台</button><div id="loginError" class="error"></div></form></section><section id="appView" class="shell hidden"><header class="topbar"><div class="brand"><div class="logo">◆</div><div><h1>dsh-manager</h1><small id="welcome">实例控制中心</small></div></div><div class="top-actions"><button id="refreshButton" class="secondary">刷新</button><button id="logoutButton" class="secondary">退出登录</button></div></header><main class="grid"><section class="card"><h2>运行概览</h2><div class="stats"><div class="stat"><span class="muted">在线 Agent</span><b id="agentCount">0</b></div><div class="stat"><span class="muted">dsh 实例</span><b id="instanceCount">0</b></div><div class="stat"><span class="muted">运行中</span><b id="runningCount">0</b></div></div></section><section class="card half"><h2>配对信息</h2><div class="instance"><div class="muted">当前配对码</div><code id="pairingCode">加载中…</code><div class="actions"><button id="refreshPairing" class="secondary">刷新配对码</button><button id="copyPairing" class="secondary">复制配对码</button></div><div class="muted">TLS 指纹</div><code id="tlsFingerprint" class="fingerprint" data-hidden="true">加载中…</code><div class="actions"><button id="toggleFingerprint" class="secondary">显示 TLS 指纹</button><button id="copyFingerprint" class="secondary">复制 TLS 指纹</button></div></div></section><section class="card half"><h2>已注册电脑</h2><div id="agents" class="instance-grid"></div></section><section class="card half"><h2>所有 dsh 实例</h2><div id="instances" class="instance-grid"></div></section><section class="card"><div id="error" class="error"></div><span class="muted">Agent 使用 HTTPS/WSS 连接；实例操作会在目标 launcher 上执行。</span></section></main></section><script src="/app.js" defer></script></body></html>
